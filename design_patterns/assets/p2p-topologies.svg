<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Comparison of four peer-to-peer network topologies</title>
  <desc>Four diagrams showing full mesh, gossip, tree/hierarchical, and structured overlay topologies</desc>

  <rect x="0" y="0" width="900" height="640" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ============ Full mesh ============ -->
  <text x="230" y="50" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#111827">Full mesh</text>
  <g stroke="#6366f1" stroke-width="1.2" opacity="0.32">
    <line x1="315" y1="180" x2="272.5" y2="253.6"/><line x1="315" y1="180" x2="187.5" y2="253.6"/><line x1="315" y1="180" x2="145" y2="180"/><line x1="315" y1="180" x2="187.5" y2="106.4"/><line x1="315" y1="180" x2="272.5" y2="106.4"/>
    <line x1="272.5" y1="253.6" x2="187.5" y2="253.6"/><line x1="272.5" y1="253.6" x2="145" y2="180"/><line x1="272.5" y1="253.6" x2="187.5" y2="106.4"/><line x1="272.5" y1="253.6" x2="272.5" y2="106.4"/>
    <line x1="187.5" y1="253.6" x2="145" y2="180"/><line x1="187.5" y1="253.6" x2="187.5" y2="106.4"/><line x1="187.5" y1="253.6" x2="272.5" y2="106.4"/>
    <line x1="145" y1="180" x2="187.5" y2="106.4"/><line x1="145" y1="180" x2="272.5" y2="106.4"/>
    <line x1="187.5" y1="106.4" x2="272.5" y2="106.4"/>
  </g>
  <g fill="#6366f1" stroke="#ffffff" stroke-width="1.5">
    <circle cx="315" cy="180" r="7"/><circle cx="272.5" cy="253.6" r="7"/><circle cx="187.5" cy="253.6" r="7"/><circle cx="145" cy="180" r="7"/><circle cx="187.5" cy="106.4" r="7"/><circle cx="272.5" cy="106.4" r="7"/>
  </g>
  <text x="230" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">Every peer connects to every peer — O(n²)</text>

  <!-- ============ Gossip ============ -->
  <text x="670" y="50" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#111827">Gossip / epidemic</text>
  <g stroke="#8b5cf6" stroke-width="1.4" opacity="0.55">
    <line x1="755" y1="180" x2="712.5" y2="253.6"/><line x1="712.5" y1="253.6" x2="627.5" y2="253.6"/><line x1="627.5" y1="253.6" x2="585" y2="180"/><line x1="585" y1="180" x2="627.5" y2="106.4"/><line x1="627.5" y1="106.4" x2="712.5" y2="106.4"/><line x1="712.5" y1="106.4" x2="755" y2="180"/>
  </g>
  <g stroke="#a78bfa" stroke-width="1.2" opacity="0.45" stroke-dasharray="4 4">
    <line x1="755" y1="180" x2="585" y2="180"/><line x1="712.5" y1="253.6" x2="712.5" y2="106.4"/>
  </g>
  <g fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5">
    <circle cx="755" cy="180" r="7"/><circle cx="712.5" cy="253.6" r="7"/><circle cx="627.5" cy="253.6" r="7"/><circle cx="585" cy="180" r="7"/><circle cx="627.5" cy="106.4" r="7"/><circle cx="712.5" cy="106.4" r="7"/>
  </g>
  <text x="670" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">Each peer forwards to a few neighbors</text>

  <!-- ============ Tree ============ -->
  <text x="230" y="360" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#111827">Tree / hierarchical</text>
  <g stroke="#f97316" stroke-width="1.4" opacity="0.55">
    <line x1="230" y1="420" x2="150" y2="490"/><line x1="230" y1="420" x2="310" y2="490"/>
    <line x1="150" y1="490" x2="100" y2="560"/><line x1="150" y1="490" x2="200" y2="560"/>
    <line x1="310" y1="490" x2="260" y2="560"/><line x1="310" y1="490" x2="360" y2="560"/>
  </g>
  <g fill="#f97316" stroke="#ffffff" stroke-width="1.5">
    <circle cx="230" cy="420" r="8"/><circle cx="150" cy="490" r="6.5"/><circle cx="310" cy="490" r="6.5"/>
    <circle cx="100" cy="560" r="6"/><circle cx="200" cy="560" r="6"/><circle cx="260" cy="560" r="6"/><circle cx="360" cy="560" r="6"/>
  </g>
  <text x="230" y="615" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">Few links per peer, but a fragile root</text>

  <!-- ============ Structured overlay ============ -->
  <text x="670" y="360" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#111827">Structured overlay</text>
  <g stroke="#f59e0b" stroke-width="1.4" opacity="0.5">
    <line x1="755" y1="490" x2="730.1" y2="550.1"/><line x1="730.1" y1="550.1" x2="670" y2="575"/><line x1="670" y1="575" x2="609.9" y2="550.1"/><line x1="609.9" y1="550.1" x2="585" y2="490"/><line x1="585" y1="490" x2="609.9" y2="429.9"/><line x1="609.9" y1="429.9" x2="670" y2="405"/><line x1="670" y1="405" x2="730.1" y2="429.9"/><line x1="730.1" y1="429.9" x2="755" y2="490"/>
  </g>
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 4">
    <line x1="755" y1="490" x2="670" y2="575"/><line x1="670" y1="405" x2="585" y2="490"/>
  </g>
  <g fill="#f59e0b" stroke="#ffffff" stroke-width="1.5">
    <circle cx="755" cy="490" r="6.5"/><circle cx="730.1" cy="550.1" r="6.5"/><circle cx="670" cy="575" r="6.5"/><circle cx="609.9" cy="550.1" r="6.5"/><circle cx="585" cy="490" r="6.5"/><circle cx="609.9" cy="429.9" r="6.5"/><circle cx="670" cy="405" r="6.5"/><circle cx="730.1" cy="429.9" r="6.5"/>
  </g>
  <text x="670" y="615" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">Sparse links, reachable in O(log n) hops</text>
</svg>
